name: Setup an Elvish context
description: Installs the Elvish shell.

inputs:
  version:
    description: Elvish version to install.
    default: 0.21.0

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        source bootstrap.sh
        ensureElvish '${{ inputs.version }}'
